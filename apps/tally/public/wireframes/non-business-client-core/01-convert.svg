<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" fill="none">
  <title>Non-business client convert: accept invite, walk campaign, first fund lo-fi strip</title>
  <style>
    .frame { stroke:#bdbdbd; stroke-width:2; fill:#fafafa }
    .chrome { fill:#eeeeee }
    .block { fill:#e0e0e0 }
    .cta { fill:#212121 }
    .label { fill:#757575; font: 11px system-ui,sans-serif }
    .arrow { stroke:#212121; stroke-width:2; fill:none; marker-end:url(#m) }
    .dot { fill:#9e9e9e }
  </style>
  <defs>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#212121"/>
    </marker>
  </defs>

  <text class="label" x="460" y="18" text-anchor="middle">Non-business client - accept invite to first fund</text>

  <!-- 1 accept invite -->
  <rect class="frame" x="16" y="40" width="180" height="220" rx="8"/>
  <rect class="chrome" x="16" y="40" width="180" height="26" rx="8"/>
  <text class="label" x="106" y="32" text-anchor="middle">1 - Accept invite</text>
  <rect class="block" x="32" y="80" width="148" height="14" rx="3"/>
  <rect class="block" x="32" y="102" width="148" height="40" rx="4"/>
  <text class="label" x="106" y="160" text-anchor="middle">campaign prepared for me</text>
  <rect class="cta" x="48" y="200" width="116" height="24" rx="4"/>
  <text class="label" x="106" y="217" text-anchor="middle" style="fill:#fff">Accept</text>

  <path class="arrow" d="M204 212 H236"/>

  <!-- 2 walk campaign -->
  <rect class="frame" x="244" y="40" width="180" height="220" rx="8"/>
  <rect class="chrome" x="244" y="40" width="180" height="26" rx="8"/>
  <text class="label" x="334" y="32" text-anchor="middle">2 - Walk campaign</text>
  <rect class="block" x="260" y="80" width="148" height="16" rx="3"/>
  <rect class="block" x="260" y="104" width="148" height="16" rx="3"/>
  <rect class="block" x="260" y="128" width="148" height="16" rx="3"/>
  <text class="label" x="334" y="168" text-anchor="middle">with Operator (sales call)</text>

  <path class="arrow" d="M432 212 H464"/>

  <!-- 3 first fund / become business client -->
  <rect class="frame" x="472" y="40" width="180" height="220" rx="8"/>
  <rect class="chrome" x="472" y="40" width="180" height="26" rx="8"/>
  <text class="label" x="562" y="32" text-anchor="middle">3 - First fund</text>
  <rect class="block" x="488" y="80" width="148" height="16" rx="3"/>
  <rect class="block" x="488" y="104" width="148" height="40" rx="4"/>
  <rect class="cta" x="504" y="200" width="116" height="24" rx="4"/>
  <text class="label" x="562" y="217" text-anchor="middle" style="fill:#fff">Fund</text>
  <circle class="dot" cx="496" cy="248" r="4"/>
  <text class="label" x="570" y="252" text-anchor="middle">becomes Business Client</text>

  <text class="label" x="700" y="140">Non-business client only</text>
  <text class="label" x="700" y="156">pre-first-fund</text>
</svg>
