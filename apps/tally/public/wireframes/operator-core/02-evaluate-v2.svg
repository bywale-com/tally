<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" fill="none">
  <title>Evaluate v2 - lo-fi co-piloted dossier (disco)</title>
  <style>
    .frame { stroke:#bdbdbd; stroke-width:2; fill:#fafafa }
    .chrome { fill:#eeeeee }
    .block { fill:#e0e0e0 }
    .cta { fill:#212121 }
    .label { fill:#757575; font: 11px system-ui,sans-serif }
    .ink { fill:#212121; font: 11px system-ui,sans-serif }
    .muted { fill:#9e9e9e; font: 10px system-ui,sans-serif }
    .arrow { stroke:#212121; stroke-width:2; fill:none; marker-end:url(#m) }
    .pulse { fill:#f5f5f5; stroke:#bdbdbd; stroke-dasharray:4 3 }
    .ghost { fill:#fafafa; stroke:#bdbdbd; stroke-width:1.5 }
  </style>
  <defs>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#212121"/>
    </marker>
  </defs>

  <text class="label" x="640" y="18" text-anchor="middle">Disco - co-piloted dossier (v2)</text>

  <!-- 1 search empty until type -->
  <rect class="frame" x="16" y="40" width="180" height="220" rx="8"/>
  <rect class="chrome" x="16" y="40" width="180" height="28" rx="8"/>
  <text class="label" x="106" y="32" text-anchor="middle">1 - Search (empty)</text>
  <rect class="ghost" x="32" y="88" width="148" height="28" rx="4"/>
  <text class="muted" x="106" y="106" text-anchor="middle">Type to search...</text>
  <text class="muted" x="106" y="148" text-anchor="middle">No results until type</text>
  <text class="muted" x="106" y="166" text-anchor="middle">hint only</text>

  <path class="arrow" d="M206 150 H230"/>

  <!-- 2 dossier accordion full-bleed -->
  <rect class="frame" x="240" y="40" width="200" height="220" rx="8"/>
  <rect class="chrome" x="240" y="40" width="200" height="28" rx="8"/>
  <text class="label" x="340" y="32" text-anchor="middle">2 - Dossier accordion</text>
  <rect class="block" x="256" y="84" width="168" height="22" rx="3"/>
  <text class="ink" x="264" y="99" style="font-size:10px">Company / website</text>
  <rect class="block" x="256" y="112" width="168" height="22" rx="3"/>
  <text class="ink" x="264" y="127" style="font-size:10px">Size / founded</text>
  <rect class="block" x="256" y="140" width="168" height="22" rx="3"/>
  <text class="ink" x="264" y="155" style="font-size:10px">Role / ACV / risk</text>
  <rect class="block" x="256" y="168" width="168" height="22" rx="3"/>
  <text class="ink" x="264" y="183" style="font-size:10px">Scenario / opener</text>
  <text class="muted" x="340" y="230" text-anchor="middle">full-bleed - not postcard</text>

  <path class="arrow" d="M450 150 H474"/>

  <!-- 3 unknown section -->
  <rect class="frame" x="484" y="40" width="190" height="220" rx="8"/>
  <rect class="chrome" x="484" y="40" width="190" height="28" rx="8"/>
  <text class="label" x="579" y="32" text-anchor="middle">3 - Unknown fact</text>
  <rect class="block" x="500" y="84" width="158" height="18" rx="3"/>
  <text class="ink" x="508" y="97" style="font-size:10px">one_fact_to_verify</text>
  <text class="ink" x="579" y="128" text-anchor="middle" style="font-weight:600">Can't be identified</text>
  <rect class="ghost" x="500" y="144" width="158" height="36" rx="4"/>
  <text class="muted" x="579" y="166" text-anchor="middle">Update fact...</text>
  <rect class="cta" x="500" y="196" width="90" height="22" rx="3"/>
  <text class="label" x="545" y="211" text-anchor="middle" style="fill:#fff">Update</text>

  <path class="arrow" d="M684 150 H708"/>

  <!-- 4 notes + re-analyze this -->
  <rect class="frame" x="718" y="40" width="190" height="220" rx="8"/>
  <rect class="chrome" x="718" y="40" width="190" height="28" rx="8"/>
  <text class="label" x="813" y="32" text-anchor="middle">4 - Notes + re-analyze</text>
  <rect class="block" x="734" y="84" width="158" height="14" rx="2"/>
  <text class="muted" x="742" y="94" style="font-size:9px">fact (known)</text>
  <rect class="ghost" x="734" y="108" width="158" height="48" rx="4"/>
  <text class="muted" x="813" y="130" text-anchor="middle">Call notes (NL)...</text>
  <text class="muted" x="813" y="146" text-anchor="middle">what they said</text>
  <rect class="cta" x="734" y="172" width="120" height="22" rx="3"/>
  <text class="label" x="794" y="187" text-anchor="middle" style="fill:#fff">Re-analyze this</text>
  <text class="muted" x="813" y="230" text-anchor="middle">explicit click - not autopilot</text>

  <path class="arrow" d="M918 150 H942"/>

  <!-- 5 live rewrite -->
  <rect class="frame" x="952" y="40" width="150" height="220" rx="8"/>
  <rect class="chrome" x="952" y="40" width="150" height="28" rx="8"/>
  <text class="label" x="1027" y="32" text-anchor="middle">5 - Live rewrite</text>
  <circle cx="1027" cy="118" r="16" stroke="#bdbdbd" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
  <text class="ink" x="1027" y="123" text-anchor="middle" style="font-size:14px">*</text>
  <rect class="pulse" x="968" y="152" width="118" height="12" rx="2"/>
  <rect class="pulse" x="968" y="172" width="96" height="12" rx="2"/>
  <rect class="pulse" x="968" y="192" width="108" height="12" rx="2"/>
  <text class="muted" x="1027" y="236" text-anchor="middle">notes + facts</text>

  <path class="arrow" d="M1112 150 H1136"/>

  <!-- 6 re-analyze all + clear -->
  <rect class="frame" x="1146" y="40" width="118" height="220" rx="8"/>
  <rect class="chrome" x="1146" y="40" width="118" height="28" rx="8"/>
  <text class="label" x="1205" y="32" text-anchor="middle">6 - Clear gate</text>
  <rect class="ghost" x="1158" y="88" width="94" height="28" rx="3"/>
  <text class="ink" x="1205" y="106" text-anchor="middle" style="font-size:9px">Re-analyze all</text>
  <rect class="cta" x="1158" y="136" width="94" height="28" rx="3"/>
  <text class="label" x="1205" y="154" text-anchor="middle" style="fill:#fff">Clear</text>
  <text class="muted" x="1205" y="190" text-anchor="middle">Operator</text>
  <text class="muted" x="1205" y="206" text-anchor="middle">agency</text>
  <text class="muted" x="1205" y="236" text-anchor="middle">to Enrich</text>
</svg>
