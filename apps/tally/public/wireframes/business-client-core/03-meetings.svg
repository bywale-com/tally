<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" fill="none">
  <title>Business client: Meetings  history, filters, packet sheet</title>
  <style>
    .frame { stroke:#bdbdbd; stroke-width:2; fill:#fafafa }
    .chrome { fill:#eeeeee }
    .block { fill:#e0e0e0 }
    .cta { fill:#212121 }
    .ink { fill:#212121 }
    .label { fill:#757575; font: 11px system-ui,sans-serif }
    .small { fill:#9e9e9e; font: 10px system-ui,sans-serif }
    .side { fill:#f5f5f5 }
  </style>

  <text class="label" x="500" y="18" text-anchor="middle">Business Client · Meetings  history + respond (living desk)</text>

  <rect class="frame" x="40" y="36" width="560" height="240" rx="8"/>
  <rect class="side" x="40" y="36" width="120" height="240"/>
  <rect class="chrome" x="40" y="36" width="120" height="36"/>
  <text class="label" x="52" y="58">Tally</text>
  <text class="label" x="52" y="100">Campaigns</text>
  <rect class="block" x="48" y="112" width="104" height="26" rx="4"/>
  <text class="ink" x="60" y="130" style="font: 11px system-ui,sans-serif; font-weight:600">Meetings</text>
  <text class="label" x="52" y="160">Escrow</text>

  <rect class="chrome" x="160" y="36" width="440" height="36"/>
  <text class="label" x="176" y="58">Meetings</text>

  <!-- Filters -->
  <rect class="block" x="176" y="84" width="36" height="18" rx="3"/>
  <text class="small" x="194" y="96" text-anchor="middle">All</text>
  <rect class="frame" x="218" y="84" width="56" height="18" rx="3"/>
  <text class="small" x="246" y="96" text-anchor="middle">Pending</text>
  <rect class="frame" x="280" y="84" width="52" height="18" rx="3"/>
  <text class="small" x="306" y="96" text-anchor="middle">Released</text>

  <!-- Rows -->
  <text class="ink" x="176" y="128" style="font: 12px system-ui,sans-serif; font-weight:600">Jordan Lee · Director+</text>
  <text class="label" x="176" y="146">Pending release · $500</text>
  <line x1="176" y1="158" x2="580" y2="158" stroke="#bdbdbd"/>
  <text class="ink" x="176" y="180" style="font: 12px system-ui,sans-serif; font-weight:600">Sam Rivera · VP</text>
  <text class="label" x="176" y="198">Released · $500</text>
  <line x1="176" y1="210" x2="580" y2="210" stroke="#bdbdbd"/>
  <text class="ink" x="176" y="232" style="font: 12px system-ui,sans-serif; font-weight:600">Casey Park · Director</text>
  <text class="label" x="176" y="250">Upcoming · Thu 2pm</text>

  <!-- Meeting sheet -->
  <rect class="frame" x="620" y="36" width="340" height="240" rx="8"/>
  <rect class="chrome" x="620" y="36" width="340" height="36" rx="8"/>
  <text class="ink" x="636" y="58" style="font: 12px system-ui,sans-serif; font-weight:600">Jordan Lee</text>
  <text class="small" x="930" y="58" text-anchor="end">Sheet</text>
  <text class="label" x="636" y="92">Director+ · 32 min · attended</text>
  <text class="label" x="636" y="112">Pain: pipeline without retainer</text>
  <text class="small" x="636" y="136">Escrow: Pending release · $500</text>
  <rect class="cta" x="636" y="160" width="120" height="26" rx="4"/>
  <text class="label" x="696" y="177" text-anchor="middle" style="fill:#fff">Accept release</text>
  <text class="label" x="780" y="177">This doesn't count</text>
  <text class="small" x="636" y="220">Dispute form stays closed until invite</text>
  <text class="small" x="636" y="238">Forward packet · quiet</text>
</svg>
