<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" fill="none">
  <title>Business client: Campaigns desk  vessels, Fund, More</title>
  <style>
    .frame { stroke:#bdbdbd; stroke-width:2; fill:#fafafa }
    .chrome { fill:#eeeeee }
    .block { fill:#e0e0e0 }
    .cta { fill:#212121 }
    .ink { fill:#212121 }
    .label { fill:#757575; font: 11px system-ui,sans-serif }
    .small { fill:#9e9e9e; font: 10px system-ui,sans-serif }
    .side { fill:#f5f5f5 }
  </style>

  <text class="label" x="500" y="18" text-anchor="middle">Business Client · Campaigns  my vessels (living desk)</text>

  <!-- App shell -->
  <rect class="frame" x="40" y="36" width="920" height="240" rx="8"/>
  <!-- Sidebar -->
  <rect class="side" x="40" y="36" width="160" height="240" rx="8"/>
  <rect class="side" x="40" y="36" width="160" height="240"/>
  <rect class="chrome" x="40" y="36" width="160" height="36"/>
  <text class="label" x="56" y="58">Tally · Client</text>
  <rect class="block" x="52" y="84" width="136" height="28" rx="4"/>
  <text class="ink" x="64" y="102" style="font: 11px system-ui,sans-serif; font-weight:600">Campaigns</text>
  <text class="label" x="64" y="132">Meetings</text>
  <text class="label" x="64" y="156">Escrow</text>

  <!-- Main chrome -->
  <rect class="chrome" x="200" y="36" width="760" height="36"/>
  <text class="label" x="216" y="58">Campaigns</text>
  <text class="small" x="880" y="58" text-anchor="end">Request next vessel</text>

  <!-- Panel -->
  <rect class="frame" x="220" y="88" width="720" height="168" rx="6"/>
  <rect class="chrome" x="220" y="88" width="720" height="32" rx="6"/>
  <text class="ink" x="236" y="108" style="font: 12px system-ui,sans-serif; font-weight:600">My campaigns</text>

  <!-- Vessel row -->
  <text class="ink" x="236" y="148" style="font: 12px system-ui,sans-serif; font-weight:600">Northwind outreach</text>
  <text class="label" x="236" y="166">Running. Rules locked.</text>
  <text class="small" x="236" y="184">$500 / meeting · 2 of 4 booked</text>
  <rect class="cta" x="700" y="140" width="56" height="24" rx="4"/>
  <text class="label" x="728" y="156" text-anchor="middle" style="fill:#fff">Open</text>
  <text class="label" x="780" y="156">Firms</text>
  <text class="label" x="830" y="156">More</text>

  <line x1="236" y1="200" x2="920" y2="200" stroke="#bdbdbd" stroke-width="1"/>
  <text class="ink" x="236" y="224" style="font: 12px system-ui,sans-serif; font-weight:600">Acme expansion</text>
  <text class="label" x="236" y="242">Invited. Rules locked.</text>
  <rect class="cta" x="700" y="216" width="56" height="24" rx="4"/>
  <text class="label" x="728" y="232" text-anchor="middle" style="fill:#fff">Fund</text>
  <text class="label" x="780" y="232">Terms</text>
  <text class="label" x="830" y="232">More</text>
</svg>
