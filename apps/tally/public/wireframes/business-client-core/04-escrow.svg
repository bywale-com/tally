<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" fill="none">
  <title>Business client: Escrow  held, released, reclaim with timer</title>
  <style>
    .frame { stroke:#bdbdbd; stroke-width:2; fill:#fafafa }
    .chrome { fill:#eeeeee }
    .block { fill:#e0e0e0 }
    .cta { fill:#212121 }
    .ink { fill:#212121 }
    .label { fill:#757575; font: 11px system-ui,sans-serif }
    .small { fill:#9e9e9e; font: 10px system-ui,sans-serif }
    .side { fill:#f5f5f5 }
    .muted-cta { fill:#bdbdbd }
  </style>

  <text class="label" x="500" y="18" text-anchor="middle">Business Client · Escrow  hold truth + reclaim (living desk)</text>

  <rect class="frame" x="40" y="36" width="920" height="240" rx="8"/>
  <rect class="side" x="40" y="36" width="160" height="240"/>
  <rect class="chrome" x="40" y="36" width="160" height="36"/>
  <text class="label" x="56" y="58">Tally · Client</text>
  <text class="label" x="56" y="100">Campaigns</text>
  <text class="label" x="56" y="124">Meetings</text>
  <rect class="block" x="52" y="136" width="136" height="28" rx="4"/>
  <text class="ink" x="64" y="154" style="font: 11px system-ui,sans-serif; font-weight:600">Escrow</text>

  <rect class="chrome" x="200" y="36" width="760" height="36"/>
  <text class="label" x="216" y="58">Escrow</text>
  <text class="small" x="920" y="58" text-anchor="end">Download statement</text>

  <rect class="frame" x="220" y="88" width="720" height="168" rx="6"/>
  <rect class="chrome" x="220" y="88" width="720" height="32" rx="6"/>
  <text class="ink" x="236" y="108" style="font: 12px system-ui,sans-serif; font-weight:600">Escrow</text>

  <!-- Facts -->
  <text class="small" x="236" y="140">Held</text>
  <text class="ink" x="236" y="162" style="font: 20px system-ui,sans-serif; font-weight:600">$1000</text>
  <text class="small" x="360" y="140">Released</text>
  <text class="ink" x="360" y="162" style="font: 20px system-ui,sans-serif; font-weight:600">$1000</text>

  <!-- Ledger lines -->
  <text class="label" x="236" y="190">Hold · +$2000</text>
  <text class="label" x="236" y="208">Meeting #1 · $500</text>
  <text class="label" x="236" y="226">Meeting #2 · $500</text>

  <!-- Reclaim cluster -->
  <rect class="muted-cta" x="700" y="140" width="120" height="28" rx="4"/>
  <text class="label" x="760" y="158" text-anchor="middle" style="fill:#fff">Reclaim unspent</text>
  <text class="small" x="830" y="158">Available in 9d</text>
  <text class="label" x="700" y="190">Request Operator</text>
  <text class="small" x="700" y="220">No Status essay  facts + ledger only</text>
</svg>
