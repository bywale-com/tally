<svg xmlns="http://www.w3.org/2000/svg" width="980" height="280" viewBox="0 0 980 280" fill="none">
  <title>Evaluate · lo-fi screen strip (disco emulation)</title>
  <style>
    .frame { stroke:#bdbdbd; stroke-width:2; fill:#fafafa }
    .chrome { fill:#eeeeee }
    .block { fill:#e0e0e0 }
    .cta { fill:#212121 }
    .label { fill:#757575; font: 11px system-ui,sans-serif }
    .arrow { stroke:#212121; stroke-width:2; fill:none; marker-end:url(#m) }
    .pulse { fill:#f5f5f5; stroke:#bdbdbd; stroke-dasharray:4 3 }
  </style>
  <defs>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#212121"/>
    </marker>
  </defs>

  <!-- 1 picker -->
  <rect class="frame" x="20" y="36" width="200" height="200" rx="8"/>
  <rect class="chrome" x="20" y="36" width="200" height="28" rx="8"/>
  <text class="label" x="120" y="28" text-anchor="middle">1 � Company picker</text>
  <rect class="block" x="40" y="80" width="160" height="28" rx="14"/>
  <circle cx="52" cy="94" r="6" fill="#bdbdbd"/>
  <rect class="block" x="40" y="124" width="160" height="16" rx="3"/>
  <rect class="block" x="40" y="148" width="160" height="16" rx="3"/>
  <rect class="block" x="40" y="172" width="160" height="16" rx="3"/>
  <rect class="cta" x="40" y="172" width="160" height="16" rx="3" opacity="0.15"/>

  <path class="arrow" d="M230 180 H270"/>

  <!-- 2 sequence / skeleton -->
  <rect class="frame" x="280" y="36" width="200" height="200" rx="8"/>
  <rect class="chrome" x="280" y="36" width="200" height="28" rx="8"/>
  <text class="label" x="380" y="28" text-anchor="middle">2 � Evaluate sequence</text>
  <rect class="pulse" x="300" y="88" width="160" height="18" rx="3"/>
  <rect class="pulse" x="300" y="116" width="120" height="18" rx="3"/>
  <rect class="pulse" x="300" y="144" width="140" height="18" rx="3"/>
  <rect class="pulse" x="300" y="172" width="100" height="18" rx="3"/>
  <text class="label" x="380" y="220" text-anchor="middle">emulation / skeleton</text>

  <path class="arrow" d="M490 140 H530"/>

  <!-- 3 verdict -->
  <rect class="frame" x="540" y="36" width="200" height="200" rx="8"/>
  <rect class="chrome" x="540" y="36" width="200" height="28" rx="8"/>
  <text class="label" x="640" y="28" text-anchor="middle">3 � Verdict summary</text>
  <rect class="block" x="560" y="80" width="70" height="20" rx="10"/>
  <rect class="block" x="560" y="112" width="160" height="10" rx="2"/>
  <rect class="block" x="560" y="130" width="150" height="10" rx="2"/>
  <rect class="block" x="560" y="148" width="140" height="10" rx="2"/>
  <rect class="block" x="560" y="166" width="160" height="40" rx="4"/>

  <path class="arrow" d="M750 140 H790"/>

  <!-- 4 refine note (same surface) -->
  <rect class="frame" x="800" y="36" width="160" height="200" rx="8"/>
  <rect class="chrome" x="800" y="36" width="160" height="28" rx="8"/>
  <text class="label" x="880" y="28" text-anchor="middle">4 � On disco</text>
  <rect class="block" x="820" y="90" width="120" height="50" rx="4"/>
  <text class="label" x="880" y="170" text-anchor="middle">qualify + refine</text>
  <text class="label" x="880" y="188" text-anchor="middle">no Enrich</text>
</svg>
