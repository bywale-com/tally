<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="220" viewBox="0 0 200 220" fill="none">
  <title>Campaign basics v1 - Name label + bordered Cancel</title>
  <style>
    .frame { stroke:#bdbdbd; stroke-width:2; fill:#fafafa }
    .chrome { fill:#eeeeee }
    .block { fill:#e0e0e0 }
    .cta { fill:#212121 }
    .ghost { stroke:#bdbdbd; stroke-width:1; fill:#fafafa }
    .label { fill:#757575; font: 11px system-ui,sans-serif }
    .muted { fill:#9e9e9e; font: 10px system-ui,sans-serif }
  </style>
  <rect class="frame" x="1" y="1" width="198" height="218" rx="8"/>
  <rect class="chrome" x="1" y="1" width="198" height="28" rx="8"/>
  <text class="label" x="100" y="19" text-anchor="middle">2 - Campaign basics</text>
  <text class="muted" x="20" y="56">Name</text>
  <rect class="block" x="20" y="64" width="160" height="28" rx="4"/>
  <text class="muted" x="28" y="82" style="font-size:9px">e.g. Acme founding sales</text>
  <rect class="ghost" x="48" y="170" width="56" height="24" rx="3"/>
  <text class="label" x="76" y="186" text-anchor="middle" style="font-size:10px">Cancel</text>
  <rect class="cta" x="112" y="170" width="56" height="24" rx="3"/>
  <text class="label" x="140" y="186" text-anchor="middle" style="fill:#fff;font-size:10px">Create</text>
</svg>
