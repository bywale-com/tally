<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" fill="none">
  <title>Enrich · lo-fi screen strip (off call)</title>
  <style>
    .frame { stroke:#bdbdbd; stroke-width:2; fill:#fafafa }
    .chrome { fill:#eeeeee }
    .block { fill:#e0e0e0 }
    .cta { fill:#212121 }
    .label { fill:#757575; font: 11px system-ui,sans-serif }
    .arrow { stroke:#212121; stroke-width:2; fill:none; marker-end:url(#m) }
  </style>
  <defs>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#212121"/>
    </marker>
  </defs>

  <text class="label" x="460" y="18" text-anchor="middle">Off call · not on disco</text>

  <!-- 1 enrich control on campaign -->
  <rect class="frame" x="20" y="36" width="200" height="200" rx="8"/>
  <rect class="chrome" x="20" y="36" width="200" height="28" rx="8"/>
  <text class="label" x="120" y="28" text-anchor="middle">1 � Campaign</text>
  <rect class="block" x="40" y="80" width="160" height="50" rx="4"/>
  <rect class="cta" x="40" y="150" width="110" height="26" rx="4"/>
  <text class="label" x="95" y="167" text-anchor="middle" style="fill:#fff">Enrich</text>

  <path class="arrow" d="M230 163 H270"/>

  <!-- 2 running / building list -->
  <rect class="frame" x="280" y="36" width="200" height="200" rx="8"/>
  <rect class="chrome" x="280" y="36" width="200" height="28" rx="8"/>
  <text class="label" x="380" y="28" text-anchor="middle">2 � Building list</text>
  <circle cx="380" cy="130" r="22" stroke="#bdbdbd" stroke-width="3" fill="none" stroke-dasharray="10 6"/>
  <text class="label" x="380" y="190" text-anchor="middle">CRM / Apollo lane</text>

  <path class="arrow" d="M490 140 H530"/>

  <!-- 3 firm list -->
  <rect class="frame" x="540" y="36" width="200" height="200" rx="8"/>
  <rect class="chrome" x="540" y="36" width="200" height="28" rx="8"/>
  <text class="label" x="640" y="28" text-anchor="middle">3 � Firm list</text>
  <rect class="block" x="560" y="78" width="160" height="22" rx="3"/>
  <rect class="block" x="560" y="106" width="160" height="22" rx="3"/>
  <rect class="block" x="560" y="134" width="160" height="22" rx="3"/>
  <rect class="block" x="560" y="162" width="160" height="22" rx="3"/>
  <rect class="block" x="560" y="190" width="160" height="22" rx="3"/>
  <!-- small circles as firm marks -->
  <circle cx="572" cy="89" r="5" fill="#9e9e9e"/>
  <circle cx="572" cy="117" r="5" fill="#9e9e9e"/>
  <circle cx="572" cy="145" r="5" fill="#9e9e9e"/>

  <text class="label" x="820" y="120">ready for</text>
  <text class="label" x="820" y="136">demo remove/add</text>
</svg>
