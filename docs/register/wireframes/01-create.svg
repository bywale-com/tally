<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" fill="none">
  <title>Create campaign · lo-fi screen strip</title>
  <style>
    .frame { stroke:#bdbdbd; stroke-width:2; fill:#fafafa }
    .chrome { fill:#eeeeee }
    .block { fill:#e0e0e0 }
    .line { stroke:#bdbdbd; stroke-width:1.5 }
    .cta { fill:#212121 }
    .label { fill:#757575; font: 11px system-ui,sans-serif }
    .arrow { stroke:#212121; stroke-width:2; fill:none; marker-end:url(#m) }
  </style>
  <defs>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#212121"/>
    </marker>
  </defs>

  <!-- Screen 1: campaign list / empty -->
  <rect class="frame" x="20" y="36" width="200" height="200" rx="8"/>
  <rect class="chrome" x="20" y="36" width="200" height="28" rx="8"/>
  <rect class="chrome" x="20" y="56" width="200" height="8"/>
  <text class="label" x="120" y="28" text-anchor="middle">1 � Campaigns</text>
  <rect class="block" x="40" y="80" width="160" height="14" rx="3"/>
  <rect class="block" x="40" y="104" width="140" height="10" rx="2"/>
  <rect class="block" x="40" y="124" width="150" height="10" rx="2"/>
  <rect class="block" x="40" y="144" width="130" height="10" rx="2"/>
  <rect class="cta" x="40" y="190" width="100" height="24" rx="4"/>
  <text class="label" x="90" y="206" text-anchor="middle" fill="#fff" style="fill:#fff">Create</text>

  <path class="arrow" d="M230 202 H270"/>

  <!-- Screen 2: basics sheet -->
  <rect class="frame" x="280" y="36" width="200" height="200" rx="8"/>
  <rect class="chrome" x="280" y="36" width="200" height="28" rx="8"/>
  <rect class="chrome" x="280" y="56" width="200" height="8"/>
  <text class="label" x="380" y="28" text-anchor="middle">2 � Campaign basics</text>
  <rect class="block" x="300" y="90" width="160" height="12" rx="2"/>
  <rect class="block" x="300" y="112" width="160" height="28" rx="4"/>
  <rect class="block" x="300" y="152" width="160" height="12" rx="2"/>
  <rect class="block" x="300" y="172" width="160" height="28" rx="4"/>
  <rect class="cta" x="340" y="210" width="80" height="18" rx="3"/>

  <path class="arrow" d="M490 202 H530"/>

  <!-- Screen 3: campaign ready -->
  <rect class="frame" x="540" y="36" width="200" height="200" rx="8"/>
  <rect class="chrome" x="540" y="36" width="200" height="28" rx="8"/>
  <rect class="chrome" x="540" y="56" width="200" height="8"/>
  <text class="label" x="640" y="28" text-anchor="middle">3 � Campaign exists</text>
  <rect class="block" x="560" y="90" width="120" height="14" rx="3"/>
  <rect class="block" x="560" y="116" width="160" height="60" rx="4"/>
  <rect class="cta" x="560" y="192" width="90" height="22" rx="4"/>
  <text class="label" x="605" y="207" text-anchor="middle" style="fill:#fff">Evaluate �</text>

  <text class="label" x="780" y="140">roles only</text>
  <text class="label" x="780" y="156">no shell lock</text>
</svg>
